name: Tests

# Deckt f1lab/tests ab - die Projektregel "vor Push: Tests gruen, ruff
# check . sauber" war bislang reine Handdisziplin, keine Automatisierung.
# f1analyze (10_data_engineering/f1analyze) hat eine eigene, gepfadete CI
# (f1analyze-ci.yml, ebenfalls hier - GitHub Actions erkennt nur
# .github/workflows/ im Repo-Wurzelverzeichnis) - diese hier deckt den Rest ab.

# Der Ausschluss trifft f1analyzes *Code* und *Tests*, nicht seine
# Fixtures: seit tests/test_session_fixture.py laeuft auch die
# Hauptsuite gegen den Bahrain-Cache unter tests/fixtures/. Wuerde der
# hier mit ignoriert, koennte ihn jemand aendern oder entfernen, ohne
# dass diese Suite je anspringt - dieselbe Luecke wie die, durch die
# f1analyze bei f1lab-Aenderungen nicht anlief, nur andersherum.
# paths-ignore kennt keine Ausnahmen, deshalb sind die Pfade einzeln
# aufgezaehlt statt mit einem Sternchen ueber allem.
on:
  push:
    paths-ignore:
      - "10_data_engineering/f1analyze/f1analyze/**"
      - "10_data_engineering/f1analyze/tests/test_*.py"
      - "10_data_engineering/f1analyze/tests/conftest.py"
      - "10_data_engineering/f1analyze/pyproject.toml"
      - "10_data_engineering/f1analyze/README.md"
  pull_request:
    paths-ignore:
      - "10_data_engineering/f1analyze/f1analyze/**"
      - "10_data_engineering/f1analyze/tests/test_*.py"
      - "10_data_engineering/f1analyze/tests/conftest.py"
      - "10_data_engineering/f1analyze/pyproject.toml"
      - "10_data_engineering/f1analyze/README.md"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # "deeplearning" (torch) fehlt hier mit Absicht: rund 500 MB pro Lauf,
      # mypy laeuft mit --ignore-missing-imports und keine Testdatei
      # importiert torch. tests/test_deklaration.py prueft trotzdem, dass es
      # in pyproject.toml deklariert ist.
      - run: pip install -e ".[dev,ml,warehouse,api,dashboard,cli]" mypy
      - run: ruff check .
      - run: mypy f1lab app check_setup.py conftest.py robustheit.py tests --ignore-missing-imports
      - run: >
          mypy 01_grundlagen 02_timing 03_telemetrie 04_strecke
          05_reifen_strategie 06_wetter 07_race_control 08_historie
          09_machine_learning 10_data_engineering 11_visualisierung
          12_live_timing 13_sieganalyse make_assets.py --ignore-missing-imports
      - run: pytest tests -q --cov=f1lab --cov-report=term-missing
