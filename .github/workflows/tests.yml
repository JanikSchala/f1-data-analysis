name: Tests

# Deckt f1lab/tests ab - die Projektregel "vor Push: Tests gruen, ruff
# check . sauber" war bislang reine Handdisziplin, keine Automatisierung.
# f1analyze (10_data_engineering/f1analyze) hat eine eigene, gepfadete CI
# (f1analyze-ci.yml, ebenfalls hier - GitHub Actions erkennt nur
# .github/workflows/ im Repo-Wurzelverzeichnis) - diese hier deckt den Rest ab.

on:
  push:
    paths-ignore:
      - "10_data_engineering/f1analyze/**"
  pull_request:
    paths-ignore:
      - "10_data_engineering/f1analyze/**"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,ml,warehouse,api,dashboard]" mypy
      - run: ruff check .
      - run: mypy f1lab app --ignore-missing-imports
      - run: >
          mypy 01_grundlagen 02_timing 03_telemetrie 04_strecke
          05_reifen_strategie 06_wetter 07_race_control 08_historie
          09_machine_learning 10_data_engineering 11_visualisierung
          12_live_timing make_assets.py --ignore-missing-imports
      - run: pytest tests -q --cov=f1lab --cov-report=term-missing
