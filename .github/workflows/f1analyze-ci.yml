name: f1analyze CI

# War urspruenglich unter 10_data_engineering/f1analyze/.github/workflows/
# abgelegt - GitHub Actions durchsucht aber ausschliesslich .github/workflows/
# im Repo-Wurzelverzeichnis, eine verschachtelte .github/-Struktur wird nie
# erkannt. Die Datei sah seit P34 vollstaendig korrekt aus (Pfad-Filter,
# working-directory, alle Schritte richtig), lief aber nie ein einziges Mal -
# die Annahme "GitHub Action fuer CI ist da" war falsch, niemand hat es
# bemerkt, weil kein Fehler auftrat, sondern schlicht nichts passierte.
# Hierher verschoben, damit sie tatsaechlich triggert.

# f1analyze ist ein duenner Wrapper um f1lab und rechnet nichts selbst.
# Eine Aenderung an f1lab kann diese Suite also brechen, ohne dass eine
# Datei unter f1analyze/ angefasst wird - genau so ist der pace_table()-Fix
# an ihr vorbeigelaufen. f1lab und die Paketdefinition gehoeren deshalb in
# den Filter, sonst prueft die CI wieder etwas anderes als sie soll.
#
# Die Liste steht bewusst zweimal da: GitHub Actions wertet YAML-Anker
# (&name/*name) nicht aus, ein Alias landet ungeloest im Filter.
on:
  push:
    paths:
      - "10_data_engineering/f1analyze/**"
      - "f1lab/**"
      - "pyproject.toml"
      - ".github/workflows/f1analyze-ci.yml"
  pull_request:
    paths:
      - "10_data_engineering/f1analyze/**"
      - "f1lab/**"
      - "pyproject.toml"
      - ".github/workflows/f1analyze-ci.yml"

defaults:
  run:
    working-directory: 10_data_engineering/f1analyze

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" mypy
      - run: ruff check .
      - run: mypy f1analyze --ignore-missing-imports
      - run: pytest -q
