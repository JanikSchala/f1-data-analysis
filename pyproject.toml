[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1lab"
version = "0.1.0"
description = "Bausteine fuer die Analyse von Formel-1-Renndaten mit FastF1"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Janik Schala" }]
keywords = ["formula1", "motorsport", "telemetry", "data-analysis", "fastf1"]

dependencies = [
    "fastf1>=3.4",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
warehouse = ["duckdb>=0.10", "pyarrow>=14.0"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0"]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.setuptools]
packages = ["f1lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: Test braucht Zugriff auf die F1-API (deselect mit -m 'not network')",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
