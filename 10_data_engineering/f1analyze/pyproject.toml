[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1analyze"
version = "0.1.0"
description = "Wochenend-Analyzer fuer Formel-1-Renndaten, gebaut auf f1lab und FastF1."
# dasselbe Minimum wie das Wurzelpaket f1lab, um das dieses hier nur ein
# Wrapper ist - README-Badge, f1lab/pyproject.toml und ruffs target-version
# sagen alle 3.9. Ein Wrapper kann nicht mehr verlangen als seine Basis:
# alle Module haben "from __future__ import annotations", es gibt keine
# match-Anweisung und keine Union ausserhalb von Annotationen.
requires-python = ">=3.9"
dependencies = [
    "fastf1>=3.4",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
f1analyze = "f1analyze.cli:app"

[tool.setuptools.packages.find]
include = ["f1analyze*"]
