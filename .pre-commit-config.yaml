# macht die Projektregel "vor Push: Tests gruen, ruff check . sauber"
# (siehe CLAUDE.md) technisch verbindlich statt reiner Handdisziplin.
# nur ruff-check + mypy hier - dieselben zwei Schritte, die auch
# .github/workflows/tests.yml vor pytest laufen laesst. kein ruff-format:
# der Code ist bewusst handformatiert (siehe die vielen manuellen
# Zeilenumbrueche), ein Auto-Formatter wuerde das grossflaechig umwerfen.
#
# Installation einmalig:
#     pip install pre-commit
#     pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: local
    hooks:
      - id: mypy-f1lab
        name: mypy (f1lab + app)
        entry: .venv/bin/python -m mypy f1lab app --ignore-missing-imports
        language: system
        pass_filenames: false
        files: ^(f1lab|app)/
      - id: mypy-skripte
        name: mypy (Analyseskripte)
        entry: >
          .venv/bin/python -m mypy 01_grundlagen 02_timing 03_telemetrie
          04_strecke 05_reifen_strategie 06_wetter 07_race_control
          08_historie 09_machine_learning 10_data_engineering
          11_visualisierung 12_live_timing 13_sieganalyse make_assets.py
          --ignore-missing-imports
        language: system
        pass_filenames: false
        files: ^(0[1-9]|1[0-3])_.*/.*\.py$|^make_assets\.py$
